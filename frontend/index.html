<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030303" />
  <title>Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;700;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>

  <header class="hud" id="hud" hidden>
    <div class="hud-left">
      <div class="stat"><span class="label">Score</span><strong id="score">0</strong></div>
      <div class="stat" id="extraWrap" hidden><span class="label" id="extraLabel"></span><strong id="extra"></strong></div>
    </div>
    <div class="hud-right">
      <div class="lives" id="lives" aria-label="Lives"></div>
      <button class="icon" id="pauseBtn" type="button" aria-label="Pause">❚❚</button>
    </div>
  </header>
  <div class="toast" id="toast" role="status"></div>

  <!-- start -->
  <section class="screen" id="startScreen">
    <div class="panel hero">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="tagline" id="tagline"></p>
      <p class="desc" id="desc"></p>
      <button class="btn primary big" id="playBtn" type="button">Play</button>
      <p class="hint" id="hint"></p>
      <div class="row">
        <button class="btn ghost" id="boardBtn" type="button">🏆 Leaderboard</button>
        <button class="btn ghost" id="accountBtn" type="button">Log in</button>
      </div>
      <p class="preview-note" id="previewNote" hidden>Preview: scores and accounts here are not saved.</p>
    </div>
  </section>

  <!-- game over -->
  <section class="screen" id="overScreen" hidden>
    <div class="panel">
      <p class="kicker" id="overKicker">Game over</p>
      <div class="final"><span>Score</span><strong id="finalScore">0</strong></div>
      <p class="best" id="bestLine"></p>
      <p class="save" id="saveLine"></p>
      <button class="btn primary big" id="againBtn" type="button">Play again</button>
      <div class="row">
        <button class="btn ghost" id="overBoardBtn" type="button">🏆 Leaderboard</button>
        <button class="btn ghost" id="overLoginBtn" type="button">Log in to save</button>
        <button class="btn ghost" id="menuBtn" type="button">Menu</button>
      </div>
    </div>
  </section>

  <!-- pause -->
  <section class="screen" id="pauseScreen" hidden>
    <div class="panel small">
      <h2>Paused</h2>
      <button class="btn primary big" id="resumeBtn" type="button">Resume</button>
      <button class="btn ghost" id="quitBtn" type="button">Quit to menu</button>
    </div>
  </section>

  <!-- leaderboard -->
  <section class="screen modal" id="boardScreen" hidden>
    <div class="panel">
      <div class="modal-head"><h2>Leaderboard</h2><button class="icon" id="boardClose" type="button" aria-label="Close">✕</button></div>
      <div class="seg" role="tablist">
        <button type="button" class="on" data-range="all">All time</button>
        <button type="button" data-range="week">This week</button>
      </div>
      <ol class="board" id="boardList"></ol>
      <p class="me" id="boardMe"></p>
    </div>
  </section>

  <!-- account -->
  <section class="screen modal" id="authScreen" hidden>
    <form class="panel" id="authForm" autocomplete="on">
      <div class="modal-head"><h2 id="authTitle">Log in</h2><button class="icon" id="authClose" type="button" aria-label="Close">✕</button></div>
      <p class="muted" id="authHelp">Log in to save your scores to the leaderboard.</p>
      <label>Player name<input id="authName" name="username" autocomplete="username" maxlength="16" required /></label>
      <label>Password<input id="authPass" name="password" type="password" autocomplete="current-password" minlength="6" required /></label>
      <p class="error" id="authError" role="alert"></p>
      <button class="btn primary big" id="authSubmit" type="submit">Log in</button>
      <button class="link" id="authSwitch" type="button">New here? Create an account</button>
    </form>
  </section>

  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
